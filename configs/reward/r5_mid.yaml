  ustune tasiyip 14/14 tutmayi koruyabilir.
  Tek acik kriter (GUI-02) bunu hedefler. Basarisiz olursa r3 secilir ve
  GUI-02 acikca "saglanmadi" olarak raporlanir -- esik GEVSETILMEZ.
