name: reward_r3_both
notes: 'HIPOTEZ 3 -- IKISI BIRDEN + YOGUN SEKILLENDIRME GERI CEKILIR. Seyrusefer artik
  cozulmus durumda (verim 0.87-0.89), yani ilerleme teriminin kesif gorevi bitti;
  tam agirlikta kalmasi yalnizca kalite sinyalini bastiriyor. w_progress 1.0 -> 0.4
  toplam getiriyi ~2374''ten ~1500''e cekerken, r_waypoint 60 ile kaliteye bagli band
  ~%2.5''e cikar ve cekirdek hizalamasi da devrede olur. RISK: ilerleme agirligini
  dusurmek seyrusefer verimini bozabilir -- bu yuzden verim de ikincil olcut olarak
  raporlanmalidir.

  '
